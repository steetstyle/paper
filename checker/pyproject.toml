[project]
name = "checker-app"
version = "0.1.0"
description = "Sentence-level AI-authorship risk and plagiarism checker for text documents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
# Perplexity / burstiness (causal LM) and the HuggingFace classifier.
# ``sentencepiece`` is only needed by sentencepiece-based causal LMs.
ai = ["torch>=2.2", "transformers>=4.40", "sentencepiece>=0.2", "numpy>=1.26"]
# Read the same formats paper-app can ingest so a paper can be checked directly.
html = ["beautifulsoup4>=4.12"]
pdf = ["pypdf>=4.2"]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "mypy>=1.10",
]
# Model Context Protocol server for Claude Desktop / Claude Code / any MCP client.
# Pinned to 2.x, where ``FastMCP`` is renamed ``MCPServer``.
mcp = ["mcp>=2.0,<3"]

[project.scripts]
checker = "checker_app.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["checker_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false