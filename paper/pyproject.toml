[project]
name = "paper-app-backend"
version = "0.1.0"
description = "ArXiv AI assistant backend: search, HTML/PDF ingestion, MinerU extraction, embeddings + vector store."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "tenacity>=8.3",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "orjson>=3.10",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13",
    "typer>=0.12",
    "rich>=13.7",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
postgres = [
    "asyncpg>=0.29",
    "psycopg[binary]>=3.1",
    "pgvector>=0.3.6",
]
openai = ["openai>=1.40"]
local = ["sentence-transformers>=3.0", "torch>=2.2"]
# MinerU `pipeline` backend. Known-good resolution for MinerU 2.x:
#   torch<2.6         2.6 flipped torch.load(weights_only=True), which breaks
#                     doclayout_yolo checkpoints
#   transformers<4.50 Unimernet imports pytorch_utils symbols removed in 4.50
mineru = [
    "mineru>=2.0,<3",
    "torch>=2.2,<2.6",
    "transformers<4.50",
    "doclayout-yolo",
    "rapid-table",
    "ultralytics",
    "pdfminer.six",
    "scikit-image",
    "ftfy",
    "shapely",
    "pyclipper",
    "dill",
]
qdrant = ["qdrant-client>=1.9"]
html = ["beautifulsoup4>=4.12", "markdownify>=0.13"]
# Always-available last-resort PDF text extraction so ingestion degrades
# gracefully instead of failing when MinerU is not installed.
fallback = ["pypdf>=4.2"]
# Model Context Protocol server for Claude Desktop / Claude Code / any MCP client.
# Pinned to 2.x, where `FastMCP` was renamed to `MCPServer`.
mcp = ["mcp>=2.0,<3"]
numpy = ["numpy>=1.26"]
dev = [
    "pypdf>=4.2",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "aiosqlite>=0.20",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
paper = "paper_app.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["paper_app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false